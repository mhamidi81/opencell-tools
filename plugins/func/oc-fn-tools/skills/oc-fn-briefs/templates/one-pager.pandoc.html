<!doctype html>
<!--
  Opencell branded one-pager — Pandoc HTML TEMPLATE (oc-fn-briefs skill, Tier-1 markdown path).

  This is the FIXED CHROME for a markdown-authored brief: the red header band + inlined white
  logo, the title/accent/meta/lead block, and the CSS links. The document's body comes from a
  `.md` source (the greppable source of truth); pandoc renders it into the body slot below.

  It is NOT filled by hand — pandoc renders it. See SKILL.md § Rendering (Tier 1):

    pandoc <slug>.md \
      --template <skill>/templates/one-pager.pandoc.html \
      --lua-filter <skill>/theme/oc-brief.lua \
      --css <skill>/theme/brand.css --embed-resources --standalone \
      -o <slug>.html

  --embed-resources inlines brand.css (and any local image) into the output, so the committed
  <slug>.html is self-contained (offline, CSP-safe) — same guarantee as the Tier-2 template.
  The logo is inlined here directly (fixed chrome, never changes per document).

  Metadata variables (set in the .md YAML front matter):
    title   — document title (required)
    accent  — trailing phrase rendered in red after the title (optional)
    tag      — classification pill in the header band (optional, e.g. "Internal · confidential")
    meta    — the grey context line under the title (optional; markdown inline OK, e.g. **bold**)
    lead    — an intro sentence rendered as p.lead (optional)
    lang    — document language (optional; defaults to en)
-->
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$$else$Opencell document$endif$</title>
$for(css)$
<link rel="stylesheet" href="$css$">
$endfor$
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>
<div class="sheet">
  <div class="band">

$if(tag)$    <span class="tag">$tag$</span>
$endif$  </div>
$if(title)$
  <h1>$title$$if(accent)$ <span class="sub">$accent$</span>$endif$</h1>
$endif$
$if(meta)$  <p class="meta">$meta$</p>
$endif$
$if(lead)$  <p class="lead">$lead$</p>
$endif$
$body$
</div>
</body>
</html>
